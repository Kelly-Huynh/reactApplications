<!DOCTYPE html>
<html>
    <title>
        JavaScript practice
    </title>
    <body>
        Hello World!

        <p aria-live="polite">
            <h2>TODO list</h2>
            <button id="my-button" onclick="attachListener()">Click to show</button>
            <p id="title"></p>
            <p id="completed"></p>
        </p>

        <p id="salmon-recipe">
            <h2>Salmon bagel with jam</h2>
            <ol>
                <li id="step-one"></li>
                <li id="step-two"></li>
                <li id="step-three"></li>
            </ol>
        </p>

        <p>
            <h2 id="new-recipe">Tea</h2>
            <ol id="recipe-list"></ol>     
        </p>

        <p aria-live="polite">
            <h2 id="random-joke-heading">A random joke</h2>
            <button id="my-joke-button" onclick="attachJokeListener()">Click to show punchline</button>
            <p id="setup"></p>
            <p id="punchline"></p>
        </p>
        
        <script type="text/javascript" src="index.js"></script>
        
    </body>
</html>
